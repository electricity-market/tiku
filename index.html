.policy-card h4 { color:#172033; font-size:16px; }
.policy-category { color:#475467; background:#f2f4f7; }
.policy-lifecycle-bar { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 16px; }
.policy-lifecycle-filter { padding:8px 12px; border:1px solid #d7dde8; border-radius:999px; background:#fff; color:#475467; cursor:pointer; }
.policy-lifecycle-filter.active { border-color:var(--primary); background:#eaf1ff; color:var(--primary); font-weight:700; }
.policy-badge { display:inline-flex; align-items:center; margin-left:7px; padding:3px 8px; border-radius:999px; font-size:12px; font-weight:700; }
.policy-badge.latest { color:#175cd3; background:#eaf2ff; }
.policy-badge.upcoming { color:#b54708; background:#fff3dc; }
.policy-badge.replaced { color:#b42318; background:#fee4e2; }
.policy-badge.current { color:#067647; background:#e8f7ee; }
.policy-source-line { display:flex; gap:6px 16px; flex-wrap:wrap; margin-top:7px; color:#667085; font-size:12px; }
.policy-source-line a { color:var(--primary); text-decoration:none; }
.feedback-fab { position:fixed; right:28px; bottom:88px; z-index:30; padding:12px 16px; border:0; border-radius:999px; background:#172033; color:#fff; box-shadow:0 8px 24px rgba(23,32,51,.22); cursor:pointer; font-weight:700; }
.feedback-dialog { width:min(540px,calc(100vw - 32px)); padding:0; border:0; border-radius:16px; box-shadow:0 24px 70px rgba(15,23,42,.28); }
.feedback-dialog::backdrop { background:rgba(15,23,42,.48); }
.feedback-form { padding:22px; }
.feedback-form h2 { margin:0 0 6px; }
.feedback-form p { margin:0 0 16px; color:#667085; }
.feedback-form label { display:block; margin-top:12px; color:#344054; font-weight:700; }
.feedback-form select,.feedback-form textarea,.feedback-form input { width:100%; margin-top:6px; padding:10px 12px; border:1px solid #d0d5dd; border-radius:9px; background:#fff; font:inherit; }
.feedback-form textarea { min-height:120px; resize:vertical; }
.feedback-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:18px; }
@media (max-width: 768px) {
  .bank-switcher { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .bank-tab { padding: 10px 5px; font-size: 12px; }
  .policy-toolbar { position: static; }
  .policy-search { min-width: 100%; }
  .policy-dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .policy-stat { padding: 10px; }
  .policy-stat strong { font-size: 18px; }
  .policy-intro-row { display:block; }
  .policy-home-search { width:100%; margin-top:18px; }
  .policy-action.primary { margin-left: 0; }
  .reader-head { position: static; }
  .reader-body { padding: 20px 17px; font-size: 16px; }
  .reader-title { font-size: 21px; }
  .reader-pdf { height: 78vh; min-height: 560px; }
  .header { align-items:flex-start; }
  .home-grid,.section-grid,.policy-category-grid,.policy-list { grid-template-columns:1fr; }
  .home-hero { margin-top:24px; }
  .home-entry { min-height:180px; }
}

.card .problem-text .sec-title, .ans-body .sec-title { font-weight: 700; color: var(--primary); margin: 14px 0 6px; }
.table-caption { font-weight: 600; text-align: center; margin: 12px 0 4px; font-size: 13px; color: #3c4043; }
.data-table { margin: 12px 0; overflow-x: auto; }
.ans-body { font-size: 13px; line-height: 1.8; }
.ans-body p { margin-bottom: 6px; }
.ans-body p.sub-item { padding-left: 20px; }
.ans-body p.sub-item::before { content: "•"; color: var(--primary); margin-right: 8px; }
.ans-body table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
</style>

<body>
<div class="login-gate" id="loginGate">
  <form class="login-panel" onsubmit="return login(event)">
    <div class="login-mark">电</div>
    <h1>电力交易学习平台</h1>
    <p>请登录后进入学习平台</p>
    <label class="login-field">账号<input id="loginUsername" type="text" autocomplete="username" required autofocus></label>
    <label class="login-field">密码<input id="loginPassword" type="password" autocomplete="current-password" required></label>
    <button class="login-submit" type="submit">登录</button>
    <div class="login-error" id="loginError" role="alert"></div>
  </form>
</div>

<div class="container">
  <aside class="sidebar">
    <h2 id="sidebarTitle">仿真分析大题</h2>
    <div class="mode-toggle">
      <input type="checkbox" id="studyMode" onchange="toggleMode()">
      <label for="studyMode">学习模式（默认展开答案）</label>
    </div>
    <div class="progress">
      完成进度：<span id="progressText">0/14</span>
      <div class="progress-bar"><div id="progressBar"></div></div>
    </div>
    <ul id="navList"></ul>
    <div class="progress-tools">
      <button type="button" onclick="exportProgress()">导出进度</button>
      <button type="button" onclick="document.getElementById('progressFile').click()">导入进度</button>
      <input id="progressFile" type="file" accept="application/json,.json" class="hidden" onchange="importProgress(event)">
    </div>
    <button class="reset-btn" onclick="resetProgress()">重置进度</button>
  </aside>

  <main class="main">
    <div class="header">
      <div><h1>电力交易学习平台</h1>
      <div class="subtitle" id="pageSubtitle">选择一个学习模块开始</div></div>
      <button class="home-button" type="button" onclick="renderHome()">返回首页</button>
    </div>
    <div id="contentArea"></div>
  </main>
</div>
<button class="back-to-top" id="backToTop" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="回到顶部">↑</button>
<button class="feedback-fab" type="button" onclick="openFeedback()">问题反馈</button>
<dialog class="feedback-dialog" id="feedbackDialog">
  <form class="feedback-form" onsubmit="submitFeedback(event)">
    <h2>问题反馈</h2><p>可报告错题、答案错误、政策失效或页面问题。</p>
    <label>问题类型<select id="feedbackType"><option>错题或题干问题</option><option>答案或解析错误</option><option>政策失效或被替代</option><option>页面功能问题</option><option>其他建议</option></select></label>
    <label>问题说明<textarea id="feedbackDetail" required placeholder="请说明题号、政策名称或具体问题"></textarea></label>
    <label>联系方式（选填）<input id="feedbackContact" placeholder="方便需要时进一步核实"></label>
    <div class="feedback-actions"><button class="policy-action" type="button" onclick="closeFeedback()">取消</button><button class="policy-action primary" type="submit">提交反馈</button></div>
  </form>
</dialog>

function policyCategories() {
  return ['全部', ...new Set(POLICY_DATA.map(item => item.category))];
}

function policyKey(item) {
  return item.doc + '|' + item.title;
}

function policyDateHtml(key) {
  const date = policyDateValue(key);
  if (!date) return '';
  return '<div class="policy-date">发布时间：' + esc(date.replace(/-/g, '.')) + '</div>';
}

function policyDateValue(key) {
  let date = POLICY_DATES[key];
  if (!date) {
    const title = key.slice(key.indexOf('|') + 1);
    const normalizedTitle = title.replace(/[\s《》（）()〔〕﹝﹞，,。·“”'‘’]/g, '');
    const fallbackKey = Object.keys(POLICY_DATES).find(candidate => {
      const candidateTitle = candidate.slice(candidate.indexOf('|') + 1);
      return candidateTitle.replace(/[\s《》（）()〔〕﹝﹞，,。·“”'‘’]/g, '') === normalizedTitle;
    });
    if (fallbackKey) date = POLICY_DATES[fallbackKey];
  }
  return date || '';
}

function policyLifecycle(item) {
  const key = policyKey(item);
  if (POLICY_LIFECYCLE[key]) return POLICY_LIFECYCLE[key];
  const date = policyDateValue(key);
  if (date && new Date(date + 'T00:00:00') >= new Date('2025-08-21T00:00:00')) return {status:'最新政策', note:'近一年发布'};
  return {status:'现行政策', note:''};
}

function policySource(item) {
  if (!item.url) return {label:'本地政策原文库', url:''};
  try {
    const host = new URL(item.url).hostname;
    if (host.includes('ndrc.gov.cn')) return {label:'国家发展改革委', url:item.url};
    if (host.includes('nea.gov.cn')) return {label:'国家能源局', url:item.url};
    if (host.includes('gov.cn')) return {label:'政府官方网站', url:item.url};
    return {label:host.replace(/^www\./,''), url:item.url};
  } catch (_) { return {label:'公开来源', url:item.url}; }
}

function policyInfoHtml(item) {
  const lifecycle = policyLifecycle(item);
  const source = policySource(item);
  const cls = lifecycle.status === '最新政策' ? 'latest' : lifecycle.status === '即将失效' ? 'upcoming' : lifecycle.status === '已废止/被替代' ? 'replaced' : 'current';
  const sourceHtml = source.url ? '<a href="' + esc(source.url) + '" target="_blank" rel="noopener noreferrer">来源：' + esc(source.label) + ' ↗</a>' : '<span>来源：' + esc(source.label) + '</span>';
  return '<span class="policy-badge ' + cls + '" title="' + esc(lifecycle.note || lifecycle.status) + '">' + esc(lifecycle.status) + '</span><div class="policy-source-line">' + sourceHtml + '<span>核验日期：' + POLICY_REVIEWED_AT.replace(/-/g,'.') + '</span></div>';
}

function sortPolicies(items) {
  return [...items].sort((a,b) => (policyDateValue(policyKey(b)) || '0000-00-00').localeCompare(policyDateValue(policyKey(a)) || '0000-00-00') || a.title.localeCompare(b.title, 'zh-CN'));
}

function policySubcategories() {
  if (policyCategory === '全部') return ['全部'];
  const source = POLICY_DATA.filter(item => item.category === policyCategory);
  return ['全部', ...new Set(source.map(item => item.subcategory))];
}

function filteredPolicies() {
  const query = policyQuery.trim().toLowerCase();
  return POLICY_DATA.filter(item => {
    const categoryMatch = policyCategory === '全部' || item.category === policyCategory;
    const subcategoryMatch = policySubcategory === '全部' || item.subcategory === policySubcategory;
    const key = policyKey(item);
    const statusMatch = policyStatus === '全部' || (policyStatus === '未读' && !policyRead.includes(key)) || (policyStatus === '已读' && policyRead.includes(key)) || (policyStatus === '已收藏' && policyStarred.includes(key)) || (policyStatus === '可站内阅读' && !!POLICY_PDF_MAP[key]);
    const text = [item.title, item.doc, item.category, item.subcategory, item.summary, item.significance].join(' ').toLowerCase();
    return categoryMatch && subcategoryMatch && statusMatch && (!query || text.includes(query));
  });
}

function renderPolicyNav() {
  const ul = document.getElementById('navList');
  ul.innerHTML = '';
  policyCategories().forEach(category => {
    const li = document.createElement('li');
    const count = category === '全部' ? POLICY_DATA.length : POLICY_DATA.filter(item => item.category === category).length;
    li.className = category === policyCategory ? 'active' : '';
    li.textContent = category + '（' + count + '）';
    li.onclick = () => { policyCategory = category; policySubcategory = '全部'; renderPolicyNav(); renderPolicyColumn(); };
    ul.appendChild(li);
  });
}

function renderPolicyCategories() {
  recordRoute({view:'policy-categories'});
  setViewClass('policy-view');
  policyCategory = '全部';
  policyQuery = '';
  policyLifecycleFilter = '全部';
  const categories = policyCategories().filter(category => category !== '全部');
  let html = '<div class="section-shell"><div class="section-intro policy-intro-row"><div><h2>政策学习</h2><p>按主题进入政策清单，点击文件后直接在站内阅读 PDF 原文。</p></div><div class="policy-home-search"><input id="policyHomeSearch" type="search" autocomplete="off" placeholder="搜索政策名称或文号" aria-label="搜索政策名称或文号" oninput="updatePolicyHomeSearch(this.value)"></div></div><div id="policySearchResults" class="policy-search-results hidden"></div><div id="policyCategoryGrid" class="policy-category-grid">';
  categories.forEach(category => {
    const count = POLICY_DATA.filter(item => item.category === category).length;
    html += '<button class="policy-category-card" onclick="openPolicyCategory(\'' + esc(category) + '\')"><strong>' + esc(category) + '</strong><span>' + count + ' 份政策原文　→</span></button>';
  });
  html += '</div></div>';
  document.getElementById('contentArea').innerHTML = html;
  window.scrollTo(0, 0);
}

function updatePolicyHomeSearch(value) {
  policyQuery = value.trim();
  const resultsBox = document.getElementById('policySearchResults');
  const categoryGrid = document.getElementById('policyCategoryGrid');
  if (!resultsBox || !categoryGrid) return;
  if (!policyQuery) {
    resultsBox.classList.add('hidden');
    resultsBox.innerHTML = '';
    categoryGrid.classList.remove('hidden');
    return;
  }
  const query = policyQuery.toLowerCase();
  const results = sortPolicies(POLICY_DATA.filter(item => [item.title, item.doc].join(' ').toLowerCase().includes(query)));
  categoryGrid.classList.add('hidden');
  resultsBox.classList.remove('hidden');
  let html = '<div class="policy-search-results-head"><h3>搜索结果</h3><span class="subtitle">找到 ' + results.length + ' 份政策</span></div>';
  if (!results.length) {
    html += '<div class="policy-search-empty">没有找到匹配的政策，请换一个名称或文号试试。</div>';
  } else {
    html += '<div class="policy-list">';
    results.forEach(item => {
      const key = policyKey(item);
      const isRead = policyRead.includes(key);
      html += '<article class="policy-card ' + (isRead ? 'is-read' : '') + '" onmouseenter="warmPolicyPdf(\'' + esc(key) + '\')" onfocusin="warmPolicyPdf(\'' + esc(key) + '\')"><span class="policy-category">' + esc(item.category) + ' · ' + esc(item.subcategory) + '</span>' + policyInfoHtml(item) + '<h4>' + esc(item.title) + '</h4>';
      html += '<div class="policy-meta"><span>' + esc(item.doc || '文号未注明') + '</span>' + (isRead ? '<span style="color:#137333">✓ 已读</span>' : '') + '</div>' + policyDateHtml(key) + '<div class="policy-actions">';
      html += POLICY_PDF_MAP[key] ? '<button class="policy-action primary" onclick="openPolicyReader(\'' + esc(key) + '\')">阅读原文 →</button>' : '<span class="policy-action">暂无 PDF</span>';
      html += '</div></article>';
    });
    html += '</div>';
  }
  resultsBox.innerHTML = html;
}

function openPolicyCategory(category) {
  policyCategory = category;
  policySubcategory = '全部';
  policyLifecycleFilter = '全部';
  renderPolicyColumn();
}

function renderPolicyColumn() {
  recordRoute({view:'policy-list', category:policyCategory});
  setViewClass('policy-view');
  const categoryItems = POLICY_DATA.filter(item => item.category === policyCategory);
  const items = sortPolicies(categoryItems.filter(item => policyLifecycleFilter === '全部' || policyLifecycle(item).status === policyLifecycleFilter));
  const lifecycleOptions = ['全部','最新政策','即将失效','已废止/被替代'];
  let html = '<div class="section-shell"><div class="policy-list-head"><div><h2>' + esc(policyCategory) + '</h2><div class="subtitle">按发布时间从新到旧 · 当前显示 ' + items.length + ' / ' + categoryItems.length + ' 份</div></div><button type="button" onclick="renderPolicyCategories()">← 返回政策主题</button></div><div class="policy-lifecycle-bar">';
  lifecycleOptions.forEach(status => { const count = status === '全部' ? categoryItems.length : categoryItems.filter(item => policyLifecycle(item).status === status).length; html += '<button class="policy-lifecycle-filter ' + (policyLifecycleFilter === status ? 'active' : '') + '" onclick="setPolicyLifecycleFilter(\'' + status + '\')">' + status + '（' + count + '）</button>'; });
  html += '</div><div class="policy-list">';
  items.forEach(item => {
    const key = policyKey(item);
    const isRead = policyRead.includes(key);
    html += '<article class="policy-card ' + (isRead ? 'is-read' : '') + '" onmouseenter="warmPolicyPdf(\'' + esc(key) + '\')" onfocusin="warmPolicyPdf(\'' + esc(key) + '\')" ontouchstart="warmPolicyPdf(\'' + esc(key) + '\')"><span class="policy-category">' + esc(item.subcategory) + '</span>' + policyInfoHtml(item) + '<h4>' + esc(item.title) + '</h4>';
    html += '<div class="policy-meta"><span>' + esc(item.doc || '文号未注明') + '</span>' + (isRead ? '<span style="color:#137333">✓ 已读</span>' : '') + '</div>' + policyDateHtml(key);

function policyTextHtml(text, title) {
  let lines = String(text).split(/\n+/).map(line => line.trim()).filter(Boolean);
  const titleAt = lines.findIndex(line => line.replace(/\s/g, '').includes(String(title).replace(/\s/g, '')));
  if (titleAt >= 0) {
    const titleLine = lines[titleAt];
    lines = lines.slice(titleAt + 1);
    const exactTitleAt = titleLine.indexOf(title);
    const suffix = exactTitleAt >= 0 ? titleLine.slice(exactTitleAt + title.length).trim() : '';
    if (suffix) lines.unshift(suffix);
  }
  lines = lines.filter((line, index) => {
    if (/^第?\s*\d+\s*页(\s*共\s*\d+\s*页)?$/.test(line)) return false;
    if (!/^\d{1,3}$/.test(line)) return true;
    if (index === 0) return false;
    const prev = lines[index - 1] || '';
    const next = lines[index + 1] || '';
    return /[〔（(第附件]$/.test(prev) || /^(号|年|月|日|条|项|章|附件)/.test(next);
  });
  let joined = lines.join('').replace(/\s+/g, ' ').trim();
  if (joined.includes('目录')) {
    const firstChapter = joined.indexOf('第一章');
    const bodyChapter = joined.indexOf('第一章', firstChapter + 3);
    if (bodyChapter > firstChapter) joined = joined.slice(bodyChapter);
  }
  joined = joined
    .replace(/\s*([，。；：！？、）》〕）])/g, '$1')
    .replace(/([《〔（])\s*/g, '$1')
    .replace(/【我要纠错】[\s\S]*$/, '')
    .replace(/(第[一二三四五六七八九十百零〇0-9]+章.{0,28}?)(?=第[一二三四五六七八九十百零〇0-9]+条)/g, '\n$1\n')
    .replace(/([。！？])(?=第[一二三四五六七八九十百零〇0-9]+条)/g, '$1\n')
    .replace(/^(第[一二三四五六七八九十百零〇0-9]+条)/, '\n$1')
    .replace(/(?=[一二三四五六七八九十]+、)/g, '\n')
    .replace(/(?=（[一二三四五六七八九十]+）)/g, '\n');
  const blocks = joined.split(/\n+/).map(value => value.trim()).filter(Boolean).flatMap(value => {
    if (/^第[一二三四五六七八九十百零〇0-9]+章/.test(value)) {
      const articleAt = value.search(/第[一二三四五六七八九十百零〇0-9]+条/);
      if (articleAt > 0) return [value.slice(0, articleAt), value.slice(articleAt)];
    }
    return [value];
  });
  const paragraphs = [];
  blocks.forEach(block => {
    if (/^(第[一二三四五六七八九十百零〇0-9]+章|[一二三四五六七八九十]+、|（[一二三四五六七八九十]+）)/.test(block) || block.length <= 190) {
      paragraphs.push(block);
      return;
    }
    const sentences = block.match(/[^。！？；]+[。！？；]?/g) || [block];
    let paragraph = '';
    sentences.forEach(sentence => {
      if (paragraph && paragraph.length + sentence.length > 180) {
        paragraphs.push(paragraph);
        paragraph = '';
      }
      paragraph += sentence;
    });
    if (paragraph) paragraphs.push(paragraph);
  });
  const mergedParagraphs = [];
  paragraphs.forEach(value => {
    const isStructural = /^(第[一二三四五六七八九十百零〇0-9]+[章节]|[一二三四五六七八九十]+、|（[一二三四五六七八九十]+）)/.test(value);
    const previous = mergedParagraphs[mergedParagraphs.length - 1];
    if (previous && !/[。！？；：]$/.test(previous) && !isStructural) mergedParagraphs[mergedParagraphs.length - 1] += value;
    else mergedParagraphs.push(value);
  });
  const displayParagraphs = mergedParagraphs.flatMap(value => {
    if (/^第[一二三四五六七八九十百零〇0-9]+章/.test(value)) {
      const articleAt = value.search(/第[一二三四五六七八九十百零〇0-9]+条/);
      if (articleAt > 0) return [value.slice(0, articleAt), value.slice(articleAt)];
    }
    return [value];
  });
  return displayParagraphs.map(value => {
    let cls = '';
    if (/^第[一二三四五六七八九十百零〇0-9]+章/.test(value)) cls = 'reader-chapter';
    else if (/^([一二三四五六七八九十]+、|（[一二三四五六七八九十]+）)/.test(value)) cls = 'reader-section';
    else if (/^第[一二三四五六七八九十百零〇0-9]+条/.test(value)) cls = 'reader-article';
    return '<p class="' + cls + '">' + esc(value) + '</p>';
  }).join('');
}

function checkSampleAnswer() {
  const q = currentSample();
  const selected = Array.from(document.querySelectorAll('input[name="sampleAnswer"]:checked')).map(el => Number(el.value)).sort();
  if (!selected.length) return showSampleResult(false, '请先选择答案。');
  const correct = selected.length === q.answer.length && selected.every((v, i) => v === q.answer.slice().sort()[i]);
  document.querySelectorAll('.option-item').forEach((item, index) => {
    item.classList.toggle('correct-option', q.answer.includes(index));
    item.classList.toggle('wrong-option', selected.includes(index) && !q.answer.includes(index));
  });
  const answerLabel = q.answer.map(i => q.options[i]?.letter).filter(Boolean).join('、');
  const detail = '正确答案：' + answerLabel + (q.explanation ? '\n解析：' + q.explanation : '');
  showSampleResult(correct, detail);
  if (correct) {
    const done = new Set(objectiveCompleted[activeBank] || []);
    done.add(q.id);
    objectiveCompleted[activeBank] = [...done];
    localStorage.setItem('huadian_objective_completed', JSON.stringify(objectiveCompleted));
    renderSampleNav(SAMPLE_BANKS[activeBank]);
  }
}

function applyRoute(route) {
  restoringHistory = true;
  try {
    if (route.view === 'question-types') renderQuestionSection();
    else if (route.view === 'written-types') renderWrittenSection();
    else if (route.view === 'bank') {
      switchQuestionType(route.bank);
      if (Number.isInteger(route.question) && route.question > 0) goTo(route.question);
    } else if (route.view === 'policy-categories') {
      activeBank = 'policy';
      renderPolicyCategories();
    } else if (route.view === 'policy-list') {
      activeBank = 'policy';
      policyCategory = route.category || '全部';

      activeBank = 'policy';
      policyCategory = route.category || '全部';
      openPolicyReader(route.key);
    } else renderHome();
  } finally {
    restoringHistory = false;
  }
}

function fixKnownTableData() {
  // 统一修复原始文档转换过程中出现的缺列、右移和空白单元格。
  const q1 = DATA[0];
  if (!q1) return;
  q1.problems.forEach(block => {
    if (!block || block.type !== 'table') return;
    if (block.caption === '表1支路参数' && block.headers.length === 5) {
      block.rows = block.rows.map((row, i) => {
        if (row.length === 4) return [String(i + 1), ...row];
        // 原始第一行被错误右移为 [始节点, 末节点, 电抗, 极限, 空白]。
        if (row.length === 5 && row[4] === '' && /^0\./.test(row[2])) {
          return [String(i + 1), row[0], row[1], row[2], row[3]];
        }
        return row;
      });
    }
    if (block.caption === '表2机组参数' && block.headers.length === 5) {
      block.rows = block.rows.map(row => {
        if (row[0] === 'G2' || row[0] === 'G4') {
          return [row[0], row[1], '150', '150', '—'];
        }
        return row;
      });
    }
  });

  const q7 = DATA.find(q => q.id === 7);
  if (q7) q7.problems.forEach(block => {
    if (!block || block.type !== 'table' || block.caption !== '表1 机组参数信息表') return;
    const cValues = {
      '装机容量（兆瓦）': '600',
      '最小可调出力（兆瓦）': '400',
      '爬坡速率（兆瓦/5分钟）': '6'
    };
    block.rows = block.rows.map(row => cValues[row[0]] ? [row[0], row[1], row[2], cValues[row[0]]] : row);
  });

  const q9 = DATA.find(q => q.id === 9);
  if (q9) q9.problems.forEach(block => {
    if (!block || block.type !== 'table' || block.headers[0] !== '机组' || block.headers.length !== 11) return;
    block.rows = block.rows.map(row => {
      if (row[0] === 'G1' && row[1] === '15：00-16：00') {
        return ['G1', '15：00-16：00', '400', '335', '350', '320', '320', '260', '320', '30', '350'];
      }
      return row;
    });
  });
}

function renderText(text, baseCls) {
  if (/^(（[一二三四五六七八九十]+）|[一二三四五六七八九十]+、|问题|参考答案|参考解答)/.test(text)) {
    return '<p class="' + baseCls + ' sec-title">' + esc(text) + '</p>';
  }
  let t = esc(text).replace(/(出清规则：|问题：)/g, '<strong>$1</strong>');
  // 已有圆圈编号或列表编号的文本不再二次拆分
  if (/[①②③④⑤⑥⑦⑧⑨⑩]/.test(text) || /^[（(][0-9]+[）)]/.test(text)) {
    return '<p class="' + baseCls + '">' + t + '</p>';
  }
  let parts = t.split(/(?=（[0-9]+）)/g);
  if (parts.length <= 1) parts = t.split(/(?=\([0-9]+\))/g);
  if (parts.length <= 1) parts = t.split(/(?<=[\u3002\uff1b;])\s*(?=[0-9]+[\u3001\.])/g);
  if (parts.length > 1) {
    let h = '';
    parts.forEach((part, idx) => {
      if (part.trim()) h += '<p class="' + baseCls + (idx > 0 ? ' sub-item' : '') + '">' + part.trim() + '</p>';
    });
    return h;
  }
  return '<p class="' + baseCls + '">' + t + '</p>';
}

}

function renderQuestion(idx) {
  const items = richQuestions();
  const q = items[idx];
  const container = document.getElementById('contentArea');

  html += '<h3><span class="qnum">' + (idx + 1) + '</span>' + esc(q.title) + '</h3>';
  html += '<div class="category">' + esc(q.category) + '</div>';

  html += '<div class="problem-text">';
  q.problems.forEach(b => { html += renderBlock(b, ''); });
  html += '</div>';

  const showClass = studyMode ? 'show' : '';
  html += '<div class="answer-section">';
  html += '<button class="answer-toggle ' + (studyMode ? 'revealed' : '') + '" id="ansBtn' + idx + '" onclick="toggleAnswer(' + idx + ')">' + (studyMode ? '隐藏答案' : '查看答案') + '</button>';
  html += '<div class="answer-content ' + showClass + '" id="ansContent' + idx + '">';

  q.answers.forEach(ans => {
    html += '<div class="answer-block">';
    html += '<h4>' + esc(ans.title) + '</h4>';
    html += '<div class="ans-body">';
    ans.blocks.forEach(b => { html += renderBlock(b, 'ans-text'); });
    html += '</div>';
    html += '</div>';
  });

  html += '</div></div>';

  html += '<div class="actions">';
  if (idx > 0) html += '<button class="btn" onclick="goTo(' + (idx - 1) + ')">← 上一题</button>';
  html += '<button class="btn btn-accent" onclick="markDone(' + idx + ')">' + (completed.includes(q.id) ? '↩ 取消掌握' : '✓ 标记掌握') + '</button>';
  html += '<button class="btn" onclick="markReview(' + idx + ')">' + (reviewLater.includes(q.id) ? '取消稍后复习' : '☆ 稍后复习') + '</button>';
  if (idx < items.length - 1) html += '<button class="btn btn-primary" onclick="goTo(' + (idx + 1) + ')">下一题 →</button>';
  html += '</div></div>';
  container.innerHTML = html;
}

function toggleAnswer(idx) {
  const content = document.getElementById('ansContent' + idx);
  const btn = document.getElementById('ansBtn' + idx);
  if (content.classList.contains('show')) {
    content.classList.remove('show');
    btn.textContent = '查看答案';
    btn.classList.remove('revealed');
  } else {
    content.classList.add('show');
    btn.textContent = '隐藏答案';
    btn.classList.add('revealed');
  }
}

function goTo(idx) {
  currentQ = idx;
  recordRoute({view:'bank', bank:activeBank, question:idx});
  renderQuestion(idx);
  renderNav();
  window.scrollTo(0, 0);
}

function markDone(idx) {
  const id = richQuestions()[idx].id;
  if (completed.includes(id)) {
    completed = completed.filter(i => i !== id);
  } else {
    completed.push(id);
    reviewLater = reviewLater.filter(i => i !== id);
  }
  saveProgress();
  renderQuestion(idx);
  updateProgress();
  renderNav();
}

function markReview(idx) {
  const id = richQuestions()[idx].id;
  if (reviewLater.includes(id)) reviewLater = reviewLater.filter(i => i !== id);
  else {
    reviewLater.push(id);
    completed = completed.filter(i => i !== id);
  }
  saveProgress();
  renderQuestion(idx);
  updateProgress();
  renderNav();
}

function saveProgress() {
  localStorage.setItem('huadian_q10_completed', JSON.stringify(completed));
  localStorage.setItem('huadian_q10_review', JSON.stringify(reviewLater));
}

function updateProgress() {
  const items = richQuestions();
  const ids = items.map(q => q.id);
  const doneCount = completed.filter(id => ids.includes(id)).length;
  const pct = items.length ? (doneCount / items.length) * 100 : 0;
  document.getElementById('progressText').textContent = doneCount + '/' + items.length;
  document.getElementById('progressBar').style.width = pct + '%';
}

function resetProgress() {
  if (confirm('确定要重置全部学习进度吗？此操作会清除“已掌握”和“稍后复习”状态。') &&
      confirm('请再次确认：重置后无法撤销。继续吗？')) {
    completed = [];
    reviewLater = [];
    localStorage.removeItem('huadian_q10_completed');
    localStorage.removeItem('huadian_q10_review');
    updateProgress();
    renderNav();
    renderQuestion(currentQ);
  }
}

function exportProgress() {
  const payload = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), completed, reviewLater }, null, 2);
  const url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = '电力交易学习进度.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importProgress(event) {
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const clean = values => Array.from(new Set((Array.isArray(values) ? values : [])
        .filter(Number.isInteger).filter(i => i >= 0 && i < DATA.length)));
      completed = clean(data.completed);
      reviewLater = clean(data.reviewLater).filter(i => !completed.includes(i));
      saveProgress();
      updateProgress();
      renderNav();
      renderQuestion(currentQ);
      alert('进度导入成功。');
    } catch (error) {
      alert('进度文件无效，请选择由本平台导出的 JSON 文件。');
    }
  };
  reader.readAsText(file, 'utf-8');
}

function openFeedback() {
  const dialog = document.getElementById('feedbackDialog');
  if (dialog.showModal) dialog.showModal();
  else dialog.setAttribute('open', '');
  setTimeout(() => document.getElementById('feedbackDetail').focus(), 50);
}

function closeFeedback() {
  const dialog = document.getElementById('feedbackDialog');
  if (dialog.close) dialog.close();
  else dialog.removeAttribute('open');
}

function submitFeedback(event) {
  event.preventDefault();
  const type = document.getElementById('feedbackType').value;
  const detail = document.getElementById('feedbackDetail').value.trim();
  const contact = document.getElementById('feedbackContact').value.trim();
  const currentTitle = document.querySelector('.reader-title,.question-title,.section-intro h2,.policy-list-head h2')?.textContent?.trim() || document.title;
  const body = ['问题类型：' + type, '所在页面：' + currentTitle, '页面地址：' + location.href, '', '问题说明：', detail, '', '联系方式：' + (contact || '未填写'), '', '提交时间：' + new Date().toLocaleString('zh-CN')].join('\n');
  const url = 'https://github.com/electricity-market/tiku/issues/new?title=' + encodeURIComponent('【反馈】' + type + '：' + currentTitle) + '&body=' + encodeURIComponent(body);
  window.open(url, '_blank', 'noopener');
  document.getElementById('feedbackDetail').value = '';
  document.getElementById('feedbackContact').value = '';
  closeFeedback();
}

if (sessionStorage.getItem('power_learning_authenticated') === '1') {
  document.body.classList.add('authenticated');
}
init();

</script>
